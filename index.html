<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memur Bülteni: İlan &amp; Haber</title>
<meta name="theme-color" content="#0f2a5c">
<meta name="description" content="Memur, kamu personeli ve KPSS haberleri, güncel kamu ilanları ve memurların sohbet alanı. Ücretsiz.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f8; --card:#fff; --ink:#0f1b33; --muted:#5a6680; --line:#e1e6ef; --soft:#eef2f8;
  --navy:#0f2a5c; --navy2:#1b3f86; --red:#c8102e; --red-d:#a50d26; --yel:#ffd54a;
  --ok:#0f7a45; --okbg:#e7f6ee; --warn:#8a5200; --warnbg:#fff3dc; --bad:#b4232f; --badbg:#fdecee;
  --nav-h:64px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy2)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.h-font{font-family:"Plus Jakarta Sans",Inter,sans-serif}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* Üst bar */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.top-r{display:flex;align-items:center;gap:10px;min-height:56px}
.top-r img{width:36px;height:36px;border-radius:50%;background:#fff;padding:2px}
.top-r .ad{flex:1;min-width:0}
.top-r .ad b{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:18px;line-height:1.1;letter-spacing:-.01em}
.top-r .ad small{display:block;font-size:12px;opacity:.75}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.ib:active{background:rgba(255,255,255,.22)}

/* Son dakika bandı */
.sd{display:flex;align-items:stretch;background:var(--red);color:#fff;min-height:40px;overflow:hidden}
.sd-l{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--red-d);font-weight:800;font-size:12px;letter-spacing:.06em}
.sd-l i{width:8px;height:8px;border-radius:50%;background:#fff;animation:nb 1.2s infinite}
@keyframes nb{50%{opacity:.25}}
.sd-k{flex:1;min-width:0;overflow:hidden;position:relative;display:flex;align-items:center}
.sd-t{display:flex;gap:36px;white-space:nowrap;animation:kay var(--sure,30s) linear infinite;padding-left:100%}
.sd-k:hover .sd-t,.sd-k:focus-within .sd-t{animation-play-state:paused}
.sd-t button{border:0;background:none;color:#fff;font-weight:600;font-size:14px;padding:8px 0;white-space:nowrap}
.sd-t button::before{content:"●";font-size:8px;vertical-align:middle;margin-right:8px;opacity:.7}
@keyframes kay{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.sd-t{animation:none;padding-left:12px;overflow-x:auto}}

/* Kategori sekmeleri */
.kt{position:sticky;top:56px;z-index:25;background:var(--bg);border-bottom:1px solid var(--line)}
.kt-s{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;max-width:760px;margin:0 auto}
.kt-s::-webkit-scrollbar{display:none}
.kt-s button{flex-shrink:0;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.kt-s button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.kt-s button.sdk[aria-pressed="false"]{color:var(--red);border-color:#f3c1c9}

/* Görünümler */
main.wrap{padding:14px 14px 30px}
.view[hidden]{display:none}
.sb{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sb h2{font-family:"Plus Jakarta Sans",sans-serif;font-size:19px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sb h2::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--red)}
.sb button{border:0;background:none;color:var(--navy2);font-weight:700;font-size:14px;min-height:40px;padding:0 4px}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:16px}

/* Kategori renkleri / küçük görsel */
.th{position:relative;border-radius:12px;display:grid;place-items:center;color:#fff;overflow:hidden;background:var(--kc,#1b3f86)}
.th::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.28),transparent 55%),linear-gradient(160deg,transparent 40%,rgba(0,0,0,.25))}
.th svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1;opacity:.95}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--kc,var(--navy2))}
.kat.ch{background:var(--kc);color:#fff;border-radius:6px;padding:3px 8px}

/* Manşet */
.mn{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 14px;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.mn::-webkit-scrollbar{display:none}
.mn-k{flex:0 0 100%;scroll-snap-align:start;border:0;padding:0;text-align:left;border-radius:18px;overflow:hidden;position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:var(--kc)}
.mn-k .th{position:absolute;inset:0;border-radius:0}
.mn-k .th svg{width:120px;height:120px;opacity:.18;position:absolute;right:-10px;top:10px}
.mn-k .mn-g{position:relative;z-index:2;padding:18px;background:linear-gradient(transparent,rgba(5,12,30,.55) 40%)}
.mn-k b{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:22px;line-height:1.2;margin:8px 0 6px;letter-spacing:-.01em}
.mn-k small{font-size:13px;opacity:.85}
.mn-k .kat.ch{background:rgba(255,255,255,.95);color:var(--kc)}
.mn-k .kat.ch.sdb{background:var(--red);color:#fff;margin-left:6px}
.mn-nok{display:flex;justify-content:center;gap:6px;margin-top:10px}
.mn-nok i{width:7px;height:7px;border-radius:999px;background:#c7cfdd;transition:.2s}
.mn-nok i.on{width:20px;background:var(--navy)}

/* Haber listesi */
.hl{display:flex;flex-direction:column;gap:10px}
.hk{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;width:100%}
.hk .th{width:96px;height:80px;flex-shrink:0}
.hk .th svg{width:30px;height:30px}
.hk-g{flex:1;min-width:0}
.hk-g b{display:block;font-size:16px;line-height:1.3;margin:3px 0 4px;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hk-g small{font-size:12px;color:var(--muted)}
.hk .yeni{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--red);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.hb{display:block;border:0;padding:0;background:#fff;border-radius:16px;overflow:hidden;text-align:left;width:100%;border:1px solid var(--line)}
.hb .th{height:150px;border-radius:0}
.hb .th svg{width:60px;height:60px}
.hb-g{display:block;padding:12px 14px 14px}
.hb-g b{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:19px;line-height:1.25;margin:4px 0 6px}
.hb-g p{margin:0 0 6px;color:var(--muted);font-size:14px}
.hb-g small{font-size:12px;color:var(--muted)}
.bos{text-align:center;color:var(--muted);padding:30px 16px}

/* İlan şeridi */
.is{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 14px;margin:0 -14px;padding:2px 14px 6px;scrollbar-width:none}
.is::-webkit-scrollbar{display:none}
.ik{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--yel)}
.ik .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ik .b{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.ik .m{font-size:13px;color:var(--muted)}
.gk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--navy2);align-self:flex-start}
.gk.acil{background:var(--badbg);color:var(--bad)}
.gk.yakin{background:var(--warnbg);color:var(--warn)}
.ik.tum{border-top-color:var(--navy);justify-content:center;align-items:center;text-align:center;font-weight:800;color:var(--navy2);background:var(--soft);flex-basis:44%}
.h-alt{font-size:12px;color:var(--muted);text-align:center;margin:26px 8px 0}

/* İlanlar */
.ilh{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.ilh b{font-family:"Plus Jakarta Sans",sans-serif;font-size:26px}
.ilh p{margin:2px 0 0;font-size:13px;opacity:.85}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.flt .ara{grid-column:1/-1}
.in{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.in:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(27,63,134,.15)}
.cipr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.cipr::-webkit-scrollbar{display:none}
.cipr button{flex-shrink:0;min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--muted)}
.cipr button[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);background:#e9effa}
.ilm{font-size:13px;color:var(--muted);margin:10px 2px}
.kart{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.kart-u{display:flex;gap:10px;align-items:flex-start}
.kart-u h3{flex:1;margin:0;font-size:16px;line-height:1.3}
.kart .kur{font-size:13px;color:var(--muted);margin-top:3px}
.yild{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.yild[aria-pressed="true"]{color:#b7860b;border-color:#f1d27a;background:#fff8df}
.yild[aria-pressed="true"] svg{fill:#f2b705;stroke:#b7860b}
.cips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cip{font-size:12px;font-weight:600;border-radius:7px;padding:4px 8px;background:var(--soft);color:var(--ink)}
.cip.p{background:#e9effa;color:var(--navy2);font-weight:700}
.kart .son{margin-top:10px;font-size:13px;font-weight:700;border-radius:9px;padding:7px 10px;background:var(--soft);color:var(--navy2)}
.kart .son.acil{background:var(--badbg);color:var(--bad)}
.kart .son.yakin{background:var(--warnbg);color:var(--warn)}
.kart .not{font-size:12px;color:var(--muted);margin-top:8px}
.ac{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;min-height:46px;border-radius:11px;background:var(--red);color:#fff;font-weight:800;text-decoration:none}
.ac:active{background:var(--red-d)}

/* Sohbet */
.sh{background:linear-gradient(140deg,#0f2a5c,#3a1f6e);color:#fff;border-radius:20px;padding:22px 18px;position:relative;overflow:hidden}
.sh::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,213,74,.18)}
.sh .rozet{display:inline-block;background:var(--yel);color:#3b2a00;font-weight:800;font-size:12px;border-radius:999px;padding:4px 10px}
.sh h2{font-family:"Plus Jakarta Sans",sans-serif;font-size:24px;line-height:1.2;margin:10px 0 6px;position:relative;z-index:1}
.sh p{margin:0;opacity:.88;font-size:14px;position:relative;z-index:1}
.oda{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.oda .th{width:46px;height:46px;border-radius:12px}
.oda .th svg{width:22px;height:22px}
.oda b{display:block;font-size:15px}
.oda small{color:var(--muted);font-size:13px}
.oda .kilit{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:4px 9px;flex-shrink:0}
.kural{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.kural li{margin:4px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:16px}
.btn.ik2{background:#fff;color:var(--navy2);border:1.5px solid var(--line)}
.btn:active{transform:scale(.99)}

/* Profil */
.pk{display:flex;align-items:center;gap:14px}
.av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;flex-shrink:0;font-family:"Plus Jakarta Sans",sans-serif}
.pk b{font-size:19px;display:block}
.pk small{color:var(--muted);font-size:14px}
.ls{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ls button,.ls a{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;border:0;background:#fff;text-align:left;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--soft)}
.ls>*:last-child{border-bottom:0}
.ls .say{margin-left:auto;color:var(--muted);font-weight:600;font-size:14px}
.ls .ok{margin-left:auto;color:#9aa5ba}
.ls .say+.ok{margin-left:8px}
.ls svg.i{color:var(--navy2)}
.ls .sil{color:var(--bad)} .ls .sil svg.i{color:var(--bad)}
.alt-not{font-size:12px;color:var(--muted);text-align:center;margin:18px 10px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.lbl .op{text-transform:none;letter-spacing:0;font-weight:500}
.hata{color:var(--bad);font-size:13px;font-weight:600;margin-top:6px}

/* Alt menü */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px rgba(15,27,51,.06)}
.bnav-i{display:flex;max-width:760px;margin:0 auto;height:var(--nav-h)}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8792a8;font-size:12px;font-weight:700;position:relative}
.bnav button[aria-current="page"]{color:var(--navy)}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.bnav .nb{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 5px}

/* Katmanlar */
.ov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.ov[hidden]{display:none}
.ov-b{display:flex;align-items:center;gap:6px;min-height:56px;padding:0 8px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.ov-b .ib{background:var(--soft);color:var(--navy)}
.ov-b .bosluk{flex:1}
.ov-b .ib[aria-pressed="true"]{color:#b7860b;background:#fff8df}
.ov-b .ib[aria-pressed="true"] svg{fill:#f2b705}
.ov-ic{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hd{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.hd .th{height:180px;margin:-16px -16px 16px;border-radius:0}
.hd .th svg{width:70px;height:70px}
.hd-img{display:block;width:calc(100% + 32px);max-width:none;height:auto;margin:-16px -16px 16px;background:#e9edf4}
.hd h1{font-family:"Plus Jakarta Sans",sans-serif;font-size:calc(24px * var(--fs,1));line-height:1.25;margin:8px 0;letter-spacing:-.01em}
.hd .t{font-size:13px;color:var(--muted)}
.hd .o{font-weight:700;font-size:calc(17px * var(--fs,1));line-height:1.5;margin:16px 0}
.hd .m{white-space:pre-line;font-size:calc(16px * var(--fs,1));line-height:1.65}
.hd .kay{margin-top:18px;font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}
.ara-b input{flex:1;min-height:44px;border:0;background:var(--soft);border-radius:12px;padding:0 12px;font-size:16px}
.ara-b input:focus{outline:2px solid var(--navy2)}
.ara-ic{padding:4px 14px 30px;max-width:760px;margin:0 auto}
.alt{position:fixed;inset:0;z-index:70;background:rgba(10,18,36,.5);display:flex;align-items:flex-end;justify-content:center}
.alt[hidden]{display:none}
.alt-k{background:#fff;width:100%;max-width:560px;max-height:90vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.alt-u{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.alt-u h2{flex:1;margin:0;font-size:18px;font-family:"Plus Jakarta Sans",sans-serif}
.alt-u .ib{background:var(--soft);color:var(--navy)}
.alt-ic{overflow-y:auto;padding:0 16px 16px}
.alt-ic p{margin:0 0 10px}
.alt-a{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
/* Sohbet odası */
.oda.tik{cursor:pointer;width:100%;text-align:left}
.oda .son{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.oda .og{flex:1;min-width:0}
.oda .ok2{margin-left:auto;color:#9aa5ba}
.oda-bas{flex:1;min-width:0;padding-left:4px}
.oda-bas b{display:block;font-size:16px}
.oda-bas small{display:block;font-size:12px;color:var(--muted)}
.msj-l{max-width:720px;margin:0 auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px}
.msj{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msj .av{width:32px;height:32px;font-size:13px}
.msj-b{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 11px;min-width:0;position:relative}
.msj-u{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--navy2);margin-bottom:2px}
.msj-u span{color:var(--muted);font-weight:500}
.msj-u .yon{background:var(--red);color:#fff;border-radius:4px;padding:0 5px;font-size:10px;font-weight:800}
.msj-m{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.msj-z{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;color:var(--muted);margin-top:2px}
.msj-z button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;min-width:28px;min-height:24px}
.msj.ben{align-self:flex-end;flex-direction:row-reverse}
.msj.ben .msj-b{background:var(--navy);color:#fff;border-color:var(--navy);border-radius:16px 16px 4px 16px}
.msj.ben .msj-z,.msj.ben .msj-z button{color:rgba(255,255,255,.7)}
.msj-gun{align-self:center;font-size:12px;font-weight:700;color:var(--muted);background:#e4e9f2;border-radius:999px;padding:3px 10px}
.yaz{flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.yaz-i{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.yaz textarea{flex:1;min-height:46px;max-height:140px;resize:none;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-size:16px;line-height:1.35;background:var(--soft)}
.yaz textarea:focus{outline:none;border-color:var(--navy2);background:#fff}
.yaz .gon{width:48px;height:48px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;flex-shrink:0}
.yaz .gon:disabled{background:#c7cfdd}
.yaz .say{font-size:11px;color:var(--muted);text-align:right;max-width:720px;margin:2px auto 0}
.yaz-not{max-width:720px;margin:0 auto;text-align:center;font-size:14px;color:var(--muted);padding:4px}
.secim{display:flex;flex-direction:column;gap:8px}
.secim button{min-height:50px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:15px;text-align:left;padding:0 14px;display:flex;align-items:center;gap:10px}
.secim button.kirmizi{color:var(--bad);border-color:#f3c1c9}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;color:var(--ink)}
.g-btn svg{width:20px;height:20px}
.yk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.yk .m{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:10px;padding:8px 10px;margin:8px 0}
.yk .a{display:flex;gap:6px;flex-wrap:wrap}
.yk .a button{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;padding:0 12px}
.yk .a button.k{background:var(--bad);border-color:var(--bad);color:#fff}
.toast-h{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));z-index:90;display:flex;justify-content:center;pointer-events:none}
.toast{background:#14213d;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-r">
    <img src="icons/logo-96.png" alt="" width="36" height="36">
    <div class="ad"><b id="baslik">Memur Bülteni</b><small id="altBaslik">Memur ve kamu haberleri</small></div>
    <button type="button" class="ib" id="araAc" aria-label="Haber ve ilan ara"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  </div>
</header>

<div id="sdBand"></div>
<nav class="kt" id="katBar" aria-label="Haber kategorileri"><div class="kt-s" id="katlar"></div></nav>

<main class="wrap">
  <section class="view" id="v-haber" aria-label="Haberler"></section>
  <section class="view" id="v-ilan" aria-label="İlanlar" hidden>
    <div class="ilh"><b id="ilSay">0</b> <span>açık kamu ilanı</span><p id="ilGun"></p></div>
    <div class="seg" role="group" aria-label="İlan listesi">
      <button type="button" data-ilseg="acik" aria-pressed="true">Açık ilanlar</button>
      <button type="button" data-ilseg="kayit" aria-pressed="false">Kaydettiklerim <span id="ilKs"></span></button>
    </div>
    <div id="ilFiltre">
      <div class="flt">
        <input class="in ara" id="ilAra" type="search" placeholder="Kurum, unvan veya il ara" aria-label="İlanlarda ara">
        <select class="in" id="ilIl" aria-label="İl"></select>
        <select class="in" id="ilSira" aria-label="Sıralama"><option value="son">Son günü yakın</option><option value="yeni">En yeni</option></select>
      </div>
      <div class="cipr" id="ilTur" role="group" aria-label="Puan şartı">
        <button type="button" data-tur="" aria-pressed="true">Tümü</button>
        <button type="button" data-tur="kpss" aria-pressed="false">KPSS puanlı</button>
        <button type="button" data-tur="yok" aria-pressed="false">KPSS şartı yok</button>
        <button type="button" data-tur="3gun" aria-pressed="false">Son 3 gün</button>
      </div>
    </div>
    <div id="ilListe"></div>
  </section>
  <section class="view" id="v-sohbet" aria-label="Sohbet" hidden></section>
  <section class="view" id="v-profil" aria-label="Profil" hidden></section>
</main>

<nav class="bnav" aria-label="Ana menü"><div class="bnav-i">
  <button type="button" data-git="haber"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 01-2-2V5z"/><path d="M17 9h3v8a2 2 0 01-2 2M8 9h5M8 13h5M8 16h3"/></svg>Haberler</button>
  <button type="button" data-git="ilan"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2M4 12h16"/></svg>İlanlar</button>
  <button type="button" data-git="sohbet"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>Sohbet</button>
  <button type="button" data-git="profil"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Profil</button>
</div></nav>

<!-- Haber detayı -->
<div class="ov" id="hd" hidden role="dialog" aria-modal="true" aria-labelledby="hdBas">
  <div class="ov-b">
    <button type="button" class="ib" id="hdKapat" aria-label="Geri"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="bosluk"></span>
    <button type="button" class="ib" id="hdYazi" aria-label="Yazı boyutu"><svg class="i" viewBox="0 0 24 24"><path d="M3 19l5-14 5 14M5 14h6M15 19l3.5-9 3.5 9M16 16h5"/></svg></button>
    <button type="button" class="ib" id="hdKaydet" aria-label="Haberi kaydet" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button>
    <button type="button" class="ib" id="hdPaylas" aria-label="Paylaş"><svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
  </div>
  <div class="ov-ic" id="hdIc"></div>
</div>

<!-- Arama -->
<div class="ov" id="ara" hidden role="dialog" aria-modal="true" aria-label="Arama">
  <div class="ov-b ara-b">
    <button type="button" class="ib" id="araKapat" aria-label="Kapat"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <input id="araIn" type="search" placeholder="Haber veya ilan ara" aria-label="Ara" autocomplete="off">
  </div>
  <div class="ov-ic"><div class="ara-ic" id="araSonuc"></div></div>
</div>

<!-- Sohbet odası -->
<div class="ov" id="oda" hidden role="dialog" aria-modal="true" aria-labelledby="odaBas">
  <div class="ov-b">
    <button type="button" class="ib" id="odaKapat" aria-label="Odalara dön"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="oda-bas"><b id="odaBas"></b><small id="odaAlt"></small></div>
  </div>
  <div class="ov-ic" id="odaIc"><div class="msj-l" id="msjL" aria-live="polite"></div></div>
  <div class="yaz" id="yaz"></div>
</div>

<!-- Alt pencere (profil formu, bilgi sayfaları) -->
<div class="alt" id="alt" hidden><div class="alt-k" role="dialog" aria-modal="true" aria-labelledby="altBas">
  <div class="alt-u"><h2 id="altBas"></h2><button type="button" class="ib" id="altKapat" aria-label="Kapat"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="alt-ic" id="altIc"></div>
  <div class="alt-a" id="altAlt"></div>
</div></div>

<div class="toast-h" id="toastHost" aria-live="polite"></div>

<script src="data/ilanlar.js"></script>
<script src="data/haberler.js"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lowerTr = s => String(s).replace(/I/g, "ı").replace(/İ/g, "i").toLowerCase();
const capTr = w => w ? (w[0] === "i" ? "İ" : w[0] === "ı" ? "I" : w[0].toUpperCase()) + w.slice(1) : w;
const KUCUK = new Set(["ve", "veya", "ile", "için", "ya", "da"]);
const KORU = new Set(["KİT", "TCDD", "DHMİ", "SGK", "A.Ş.", "T.C.", "PTT", "TRT", "AFAD", "BOTAŞ", "ETİ", "MTA", "DSİ", "TÜİK", "TİGEM", "TTK", "KKTC", "İSU", "DOKA", "TÜRKAK", "(TÜRKAK)", "(DOKA)", "İŞKUR"]);
const _bas = new Map();
function baslik(s){
  if (!s) return "";
  if (_bas.has(s)) return _bas.get(s);
  const t = s.replace(/^T\.C\.(?=\S)/, "T.C. ").split(" ").map((w, i) => KORU.has(w) || w.includes(".") ? w
      : (i > 0 && KUCUK.has(lowerTr(w))) ? lowerTr(w) : lowerTr(w).split("-").map(capTr).join("-")).join(" ")
    .replace(/\((\S)/g, (m, c) => "(" + capTr(c)).replace(/\/(\S)/g, (m, c) => "/" + capTr(c));
  _bas.set(s, t); return t;
}
function bugunISO(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function gunFark(iso){ const [y, m, d] = iso.split("-").map(Number); const b = bugunISO().split("-").map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(b[0], b[1] - 1, b[2])) / 864e5); }
const AY = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
function trTarih(iso){ const [y, m, d] = iso.split("-"); return +d + " " + AY[+m - 1] + " " + y; }
function kisaTarih(iso){ const g = gunFark(iso); return g === 0 ? "Bugün" : g === -1 ? "Dün" : g > -7 ? (-g) + " gün önce" : trTarih(iso); }
let toastZ;
function toast(m){ const h = $("#toastHost"); h.innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastZ); toastZ = setTimeout(() => h.innerHTML = "", 2200); }
const oku = (k, v) => { try { const x = localStorage.getItem(k); return x ? JSON.parse(x) : v; } catch (e) { return v; } };
const yaz = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- Veri ---------- */
const HBR = window.MB_HABERLER || { haberler: [] };
const H = (HBR.haberler || []).slice().sort((a, b) => (b.tarih + (b.saat || "")).localeCompare(a.tarih + (a.saat || "")));
const ILN = window.KPSS_ILANLAR || { ilanlar: [] };
const IL = ILN.ilanlar || [];
const IKON = {
  maas: '<path d="M3 7h18v10H3z"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/>',
  alim: '<rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2M4 12h16"/>',
  kpss: '<path d="M4 4h12l4 4v12H4z"/><path d="M8 12l2.5 2.5L16 9"/>',
  iskur: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20a6 6 0 0112 0M14 20a5 5 0 017-4.6"/>',
  atama: '<path d="M4 20h16M6 20V10l6-5 6 5v10M10 20v-5h4v5"/>',
  emeklilik: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
  sendika: '<path d="M7 11l3-3 4 2 3-3M4 20l4-4M20 20l-4-4M9 13l3 3 3-3"/><path d="M5 9l2 2M19 9l-2 2"/>',
  ogretmen: '<path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v5c3 2 7 2 10 0v-5"/>',
  mevzuat: '<path d="M12 3v18M5 7h14M7 7l-3 7a3 3 0 006 0zM17 7l-3 7a3 3 0 006 0z"/>',
  genel: '<path d="M4 5h13v14H6a2 2 0 01-2-2V5z"/><path d="M17 9h3v8a2 2 0 01-2 2M8 9h5M8 13h5"/>',
  sohbet: '<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>'
};
const KAT = [
  { id: "maas", ad: "Maaş & Zam", r: "#0f7a45" },
  { id: "alim", ad: "Alım & İlan", r: "#1b5fc1" },
  { id: "kpss", ad: "KPSS & Sınav", r: "#6a2fb4" },
  { id: "iskur", ad: "İŞKUR", r: "#d0541b" },
  { id: "atama", ad: "Atama", r: "#0f2a5c" },
  { id: "emeklilik", ad: "Emeklilik", r: "#8a5a12" },
  { id: "sendika", ad: "Sendika", r: "#b4232f" },
  { id: "ogretmen", ad: "Öğretmen", r: "#0b7c8a" },
  { id: "mevzuat", ad: "Mevzuat", r: "#4a5568" }
];
const katBul = ad => KAT.find(k => k.ad === ad) || { id: "genel", ad: ad || "Genel", r: "#1b3f86" };
const th = (x, cls = "") => { const k = katBul(x.kategori); return `<span class="th ${cls}" style="--kc:${k.r}">${x.gorsel ? `<img src="${esc(x.gorsel)}" alt="" loading="lazy">` : `<svg viewBox="0 0 24 24">${IKON[k.id] || IKON.genel}</svg>`}</span>`; };
const katEt = (x, ch) => { const k = katBul(x.kategori); return `<span class="kat${ch ? " ch" : ""}" style="--kc:${k.r}">${esc(k.ad)}</span>`; };

/* ---------- Durum ---------- */
const S = { git: "haber", kat: "tumu", ilSeg: "acik", ilTur: "", fs: oku("mb2-fs", 1) };
const KH = new Set(oku("mb2-kayit-haber", [])), KI = new Set(oku("mb2-kayit-ilan", []));
document.documentElement.style.setProperty("--fs", S.fs);

/* ---------- Son dakika bandı ---------- */
function sdCiz(){
  const L = H.filter(x => x.sonDakika).slice(0, 6);
  const b = $("#sdBand");
  if (!L.length) { b.innerHTML = ""; return; }
  b.innerHTML = `<div class="sd" role="region" aria-label="Son dakika"><span class="sd-l"><i></i>SON DAKİKA</span><div class="sd-k"><div class="sd-t" style="--sure:${Math.max(18, L.length * 9)}s">${L.map(x => `<button type="button" data-haber="${esc(x.id)}">${esc(x.baslik)}</button>`).join("")}</div></div></div>`;
}

/* ---------- Kategoriler ---------- */
function katCiz(){
  const var_ = new Set(H.map(x => katBul(x.kategori).ad));
  const L = [{ id: "tumu", ad: "Tümü" }];
  if (H.some(x => x.sonDakika)) L.push({ id: "sondakika", ad: "Son Dakika" });
  KAT.forEach(k => { if (var_.has(k.ad)) L.push(k); });
  $("#katlar").innerHTML = L.map(k => `<button type="button" data-kat="${k.id}" aria-pressed="${S.kat === k.id}" class="${k.id === "sondakika" ? "sdk" : ""}">${k.id === "sondakika" ? "● " : ""}${esc(k.ad)}</button>`).join("");
}

/* ---------- Haberler ---------- */
const hk = x => `<button type="button" class="hk" data-haber="${esc(x.id)}">${th(x)}<span class="hk-g">${katEt(x)}${gunFark(x.tarih) === 0 ? '<span class="yeni">YENİ</span>' : ""}<b>${esc(x.baslik)}</b><small>${kisaTarih(x.tarih)}</small></span></button>`;
const hb = x => `<button type="button" class="hb" data-haber="${esc(x.id)}">${th(x)}<span class="hb-g">${katEt(x)}<b>${esc(x.baslik)}</b><p>${esc(x.ozet)}</p><small>${kisaTarih(x.tarih)} · Memur Bülteni</small></span></button>`;
function aktifIlanlar(){ const b = bugunISO(); return IL.filter(a => !a.son || a.son >= b); }
function gunEt(a){
  if (!a.son) return '<span class="gk">Tarih ilanda</span>';
  const g = gunFark(a.son);
  return `<span class="gk ${g <= 3 ? "acil" : g <= 7 ? "yakin" : ""}">● ${g === 0 ? "Bugün son gün" : "Son " + g + " gün"}</span>`;
}
function ilanSerit(baslikYazi){
  const L = aktifIlanlar().filter(a => a.son).sort((x, y) => x.son.localeCompare(y.son)).slice(0, 8);
  if (!L.length) return "";
  return `<div class="sb"><h2>${esc(baslikYazi)}</h2><button type="button" data-git="ilan">Tümü →</button></div>
    <div class="is">${L.map(a => `<a class="ik" href="${esc(a.url)}" target="_blank" rel="noopener">${gunEt(a)}<span class="b">${esc(a.baslik)}</span><span class="k">${esc(baslik(a.kurum))}</span><span class="m">${esc(baslik(a.il))}${a.puan.length ? " · KPSS " + esc(a.puan.slice(0, 2).join("/")) + (a.puan.length > 2 ? "+" : "") : " · KPSS şartsız"}</span></a>`).join("")}
    <button type="button" class="ik tum" data-git="ilan">Tüm ilanlar<br>(${aktifIlanlar().length}) →</button></div>`;
}
function haberCiz(){
  const box = $("#v-haber");
  let h = "";
  if (S.kat === "tumu") {
    const M = H.filter(x => x.manset).slice(0, 5);
    if (M.length) h += `<div class="mn" id="mn">${M.map(x => { const k = katBul(x.kategori); return `<button type="button" class="mn-k" style="--kc:${k.r}" data-haber="${esc(x.id)}">${th(x)}<span class="mn-g"><span class="kat ch" style="--kc:${k.r}">${esc(k.ad)}</span>${x.sonDakika ? '<span class="kat ch sdb">Son dakika</span>' : ""}<b>${esc(x.baslik)}</b><small>${kisaTarih(x.tarih)} · Memur Bülteni</small></span></button>`; }).join("")}</div>
      <div class="mn-nok" aria-hidden="true">${M.map((x, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>`;
    const mset = new Set(M.map(x => x.id)), R = H.filter(x => !mset.has(x.id));
    h += `<div class="sb"><h2>Son haberler</h2></div><div class="hl">${R.slice(0, 4).map(hk).join("")}</div>`;
    h += ilanSerit("Son günü yaklaşan ilanlar");
    if (R.length > 4) h += `<div class="sb"><h2>Diğer haberler</h2></div><div class="hl">${R.slice(4).map(hk).join("")}</div>`;
    if (!H.length) h = '<div class="bos">Henüz haber yok.</div>';
  } else {
    const L = S.kat === "sondakika" ? H.filter(x => x.sonDakika) : H.filter(x => katBul(x.kategori).id === S.kat);
    if (S.kat === "alim") h += ilanSerit("Son günü yaklaşan ilanlar").replace('<div class="sb">', '<div class="sb" style="margin-top:4px">');
    if (!L.length) h += '<div class="bos">Bu kategoride henüz haber yok.</div>';
    else h += `<div class="hl"${S.kat === "alim" ? ' style="margin-top:16px"' : ""}>${hb(L[0])}${L.slice(1).map(hk).join("")}</div>`;
  }
  h += `<p class="h-alt">Haberler Memur Bülteni tarafından resmî kaynaklara dayanarak hazırlanır.<br>İletişim: ${esc(HBR.iletisim || "memurbultenisite@gmail.com")}</p>`;
  box.innerHTML = h;
  const mn = $("#mn");
  if (mn) mn.addEventListener("scroll", () => { const i = Math.round(mn.scrollLeft / (mn.firstElementChild.offsetWidth + 10)); $$(".mn-nok i").forEach((x, j) => x.classList.toggle("on", j === i)); }, { passive: true });
}

/* ---------- Haber detayı ---------- */
let HACIK = null;
function haberAc(id, gecmis = true){
  const x = H.find(y => y.id === id); if (!x) return;
  HACIK = x;
  const ilgili = H.filter(y => y.id !== x.id && y.kategori === x.kategori).slice(0, 3);
  const diger = ilgili.length ? ilgili : H.filter(y => y.id !== x.id).slice(0, 3);
  $("#hdIc").innerHTML = `<article class="hd">${x.gorsel ? `<img class="hd-img" src="${esc(x.gorsel)}" alt="">` : th(x)}${katEt(x, true)}${x.sonDakika ? ' <span class="kat ch" style="--kc:var(--red)">Son dakika</span>' : ""}
    <h1 id="hdBas">${esc(x.baslik)}</h1><div class="t">${trTarih(x.tarih)}${x.saat ? " " + esc(x.saat) : ""} · Memur Bülteni</div>
    ${x.ozet ? `<p class="o">${esc(x.ozet)}</p>` : ""}<div class="m">${esc(x.metin || "")}</div>

  const is = aktifIlanlar().filter(a => uy(a.kurum + " " + a.baslik + " " + a.il)).slice(0, 20);
  box.innerHTML = (hs.length ? `<div class="sb"><h2>Haberler (${hs.length})</h2></div><div class="hl">${hs.map(hk).join("")}</div>` : "")
    + (is.length ? `<div class="sb"><h2>İlanlar (${is.length})</h2></div>${is.map(ilanKart).join("")}` : "")
    + (!hs.length && !is.length ? '<div class="bos">Sonuç bulunamadı.</div>' : "");
}
function araAc(){ $("#ara").hidden = false; document.body.style.overflow = "hidden"; araCiz(); setTimeout(() => $("#araIn").focus(), 50); }

const UST = { haber: ["Memur Bülteni", "Memur ve kamu haberleri"], ilan: ["İlanlar", "Güncel kamu personel ilanları"], sohbet: ["Sohbet", "Memurların buluşma yeri"], profil: ["Profil", "Kaydettiklerin ve ayarlar"] };
function git(v, gecmis = true){
  if (!UST[v]) v = "haber";
  S.git = v;
  $$(".view").forEach(s => s.hidden = s.id !== "v-" + v);
  $$(".bnav [data-git]").forEach(b => b.dataset.git === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#sdBand").hidden = v !== "haber"; $("#katBar").hidden = v !== "haber";
  $("#baslik").textContent = UST[v][0]; $("#altBaslik").textContent = UST[v][1];
  if (v === "haber") haberCiz(); else if (v === "ilan") ilanCiz(); else if (v === "sohbet") sohbetCiz(); else profilCiz();
  window.scrollTo(0, 0);
  if (gecmis) history.replaceState(null, "", "#" + v);
}
document.addEventListener("click", e => {
  const t = e.target;
  const hb_ = t.closest("[data-haber]"); if (hb_) { haberAc(hb_.dataset.haber); return; }
  const g = t.closest("[data-git]"); if (g) { if (!$("#hd").hidden) { haberKapat(); } if (g.dataset.git === "ilan" && !t.closest(".bnav")) S.ilSeg = "acik"; git(g.dataset.git); return; }
  const k = t.closest("[data-kat]"); if (k) { S.kat = k.dataset.kat; katCiz(); haberCiz(); const s = $("#katlar"), b = $(`[data-kat="${S.kat}"]`); if (b) s.scrollTo({ left: b.offsetLeft - (s.clientWidth - b.offsetWidth) / 2, behavior: "smooth" }); window.scrollTo({ top: 0 }); return; }
  const ak = t.closest("[data-arakat]"); if (ak) { araKapat(); S.kat = ak.dataset.arakat; git("haber"); katCiz(); haberCiz(); return; }
  const iy = t.closest("[data-ikayit]"); if (iy) { const id = iy.dataset.ikayit, v = !KI.has(id); v ? KI.add(id) : KI.delete(id); yaz("mb2-kayit-ilan", [...KI]); $$(`[data-ikayit="${id}"]`).forEach(b => b.setAttribute("aria-pressed", v)); $("#ilKs").textContent = KI.size ? "(" + KI.size + ")" : ""; toast(v ? "İlan kaydedildi" : "Kayıttan çıkarıldı"); if (S.ilSeg === "kayit" && S.git === "ilan") ilanCiz(); return; }
  const pf = t.closest("[data-profil-form]"); if (pf) { profilForm(); return; }
  const bi = t.closest("[data-bilgi]"); if (bi) { const b = BILGI[bi.dataset.bilgi]; altAc(b[0], b[1]); return; }
  const ka = t.closest("[data-kayitlar]"); if (ka) { kayitlarAc(ka.dataset.kayitlar); return; }
  if (t.closest("[data-giris]")) { girisYap(); return; }
  if (t.closest("[data-cikis]")) { cikisYap(); return; }
  if (t.closest("[data-hesap-sil]")) { hesapSil(); return; }
  if (t.closest("[data-yonetim]")) { yonetimAc(); return; }
  const od = t.closest("[data-oda]"); if (od) { odaAc(od.dataset.oda); return; }
  const mm = t.closest("[data-msj]"); if (mm) { msjMenu(mm.dataset.msj); return; }
  if (t.closest("[data-gizli-ac]")) { GIZLI.clear(); yaz("mb2-gizli", []); profilCiz(); toast("Gizlediğin kullanıcılar tekrar görünür"); return; }
  if (t.closest("[data-hepsini-sil]")) {
    altAc("Bu cihazdaki kayıtlarımı sil", "<p>Bu cihazda kaydettiğin haberler, ilanlar ve gizlediğin kullanıcı listesi silinecek. Sohbet hesabın bundan etkilenmez.</p>", `<button type="button" class="btn" id="silOnay" style="background:var(--bad)">Evet, sil</button>`);
    $("#silOnay").onclick = () => { ["mb2-profil", "mb2-kayit-haber", "mb2-kayit-ilan", "mb2-gizli"].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} }); KH.clear(); KI.clear(); GIZLI.clear(); altKapat(); profilCiz(); toast("Kayıtların silindi"); };
  }
});
window.addEventListener("popstate", () => {
  const m = location.hash.match(/^#haber-(.+)$/), o = location.hash.match(/^#oda-(.+)$/);
  if (m) haberAc(decodeURIComponent(m[1]), false); else if (!$("#hd").hidden) haberKapat();
  if (o) { if (!ODA) odaAc(o[1], false); } else if (ODA) odaKapat();
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!$("#alt").hidden) altKapat(); else if (!$("#hd").hidden) $("#hdKapat").click(); else if (!$("#oda").hidden) $("#odaKapat").click(); else if (!$("#ara").hidden) araKapat(); });

/* ---------- Başlangıç ---------- */
sdCiz(); katCiz(); ilanFormKur();
(function(){
  const h = location.hash.slice(1), m = h.match(/^haber-(.+)$/);
  if (!/^oda-/.test(h)) git(m ? "haber" : (UST[h] ? h : "haber"), false);
  if (m) { history.replaceState(null, "", "#haber"); haberAc(decodeURIComponent(m[1])); }
  const o = h.match(/^oda-(.+)$/);
  if (o) { git("sohbet", false); history.replaceState(null, "", "#sohbet"); odaAc(o[1]); }

})();
